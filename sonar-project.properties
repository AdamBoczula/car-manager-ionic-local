# SonarCloud configuration
# Free for public repositories – https://sonarcloud.io
# For private repos: free tier available (LOC limits apply)
# Alternative: SonarQube Community Edition (self-hosted, free)

sonar.organization=YOUR_ORG_KEY
sonar.projectKey=car-manager
sonar.projectName=Car Manager
sonar.projectVersion=1.0.0

# Sources
sonar.sources=apps/car-manager/src,libs
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/*.spec.ts,**/test-setup.ts

# Language
sonar.language=ts

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.base.json

# Quality Gate
sonar.qualitygate.wait=true