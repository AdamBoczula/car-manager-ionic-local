name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_BRANCH: ${{ github.head_ref || github.ref_name }}
  NX_CLOUD_NO_TIMEOUTS: true
  # Firebase emulator variables (safe defaults, no real credentials needed)
  FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
  FIRESTORE_EMULATOR_HOST: localhost:8080
  NEXT_PUBLIC_FIREBASE_ENV: ci

jobs:
  quality:
    name: Quality Gate (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .cache/nx
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-

      - run: npm ci

      - name: Derive affected base (main or previous commit)
        id: affected-base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "base=HEAD~1" >> $GITHUB_OUTPUT
          fi

      - name: Format check
        run: npx nx format:check --base=${{ steps.affected-base.outputs.base }}

      - name: Lint
        run: npx nx affected -t lint --base=${{ steps.affected-base.outputs.base }}

      - name: Unit tests
        run: npx nx affected -t test --base=${{ steps.affected-base.outputs.base }}

      - name: Build
        run: npx nx affected -t build --base=${{ steps.affected-base.outputs.base }}

  quality-full:
    name: Full static analysis (knip + duplication)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Dead code detection (knip)
        run: npx knip --no-config-hints

      - name: Code duplication check (jscpd)
        run: npx jscpd --config .jscpd.json

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npm ci

      - name: Install Playwright browsers (no deps — ubuntu has them)
        run: npx playwright install chromium --with-deps

      - name: Build for e2e
        run: npx nx build car-manager --configuration=e2e

      - name: Start dev server + Firebase emulators
        run: |
          npx nx run car-manager:serve:e2e &
          npx firebase emulators:start --only auth,firestore --project carmanager-local &
          sleep 10

      - name: Run Playwright tests
        run: npx nx run car-manager-e2e:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/car-manager-e2e/playwright-report/
          retention-days: 7

  accessibility:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build for e2e
        run: npx nx build car-manager --configuration=e2e

      - name: Start dev server + Firebase emulators
        run: |
          npx nx run car-manager:serve:e2e &
          npx firebase emulators:start --only auth,firestore --project carmanager-local &
          sleep 10

      - name: Run a11y tests
        run: npx nx run car-manager-e2e:a11y

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: apps/car-manager-e2e/playwright-report/
          retention-days: 7

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Optional: only runs on push to main — verifies the full build is clean
  post-merge:
    name: Post-merge verification
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, quality-full, e2e, accessibility]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Full affected pipeline
        run: npx nx affected -t lint test build --base=$(git rev-list --max-parents=0 HEAD)

      - name: Run quality gate (full workspace)
        run: |
          npm run static:checks
          npm run knip
          npm run duplication
